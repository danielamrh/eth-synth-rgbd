# Reference camera model. Every number needs a source; keep verified: false until checked.
# Convention: depth in metres, 0.0 = invalid (same as RealSense SDK output).
#
# [R25] Rustler, Volprecht, Hoffmann. Empirical Comparison of Four Stereoscopic Depth Sensing
#       Cameras for Robotics Applications. IEEE Access 13:67564-67577, 2025.
#       doi:10.1109/ACCESS.2025.3560810 (arXiv:2501.07421). Data: https://rustlluk.github.io/rgbd-comparison
# [DS]  Intel RealSense D400 Series Product Family Datasheet, Rev. 019, October 2024.
#       https://realsenseai.com/wp-content/uploads/2024/10/Intel-RealSense-D400-Series-Datasheet-October-2024.pdf
# [BKM] Grunnet-Jepsen, Sweetser, Woodfill. Best-Known-Methods for Tuning Intel RealSense D400 Depth Cameras
#       for Best Performance, Rev 1.9. https://www.realsenseai.com/wp-content/uploads/2019/11/BKMs_Tuning_RealSense_D4xx_Cam.pdf
# [PRJ] Grunnet-Jepsen, Sweetser, Winer, Takagi, Woodfill. Projectors for Intel RealSense Depth Cameras D4xx, Rev 1.0.
#       https://realsenseai.com/wp-content/uploads/2019/03/WhitePaper_on_Projectors_for_RealSense_D4xx_1.0.pdf
# [K17] Keselman, Woodfill, Grunnet-Jepsen, Bhowmik. Intel RealSense Stereoscopic Depth Cameras. CVPR Workshops 2017,
#       arXiv:1705.05548. Measurements are for the R200; D400 stated to follow the same principles (Sec. 5).
# Choice rationale [R25, Sec. IV-C, V]: D435 recommended for table-top object perception up to ~1 m;
# D455 worse on complex shapes below 150 cm (attributed to its larger baseline, Sec. IV-B).
name: Intel RealSense D435   # depth module D430 [DS Table 3-49]

image:
  # Depth stream setting used in [R25] for their D435 recordings; listed depth mode in [DS Sec. 4].
  width: {value: 848, source: "[R25] Table 2", verified: true}
  height: {value: 480, source: "[R25] Table 2", verified: true}

intrinsics:
  # Derived, not stated: D430 imager OV9282, 1280x800 active pixels, HFOV 90 +/- 1 deg,
  # VFOV 64 +/- 1 deg [DS Table 3-13] -> fx = 640 / tan(45 deg) = 640 px, fy = 400 / tan(32 deg) = 640 px
  # (square pixels). Assumption: 848x480 is the HD 1280x720 mode scaled by 848/1280, so f = 424 px.
  # Check: 720-row crop gives VFOV 58.7 deg, consistent with depth FOV HD V:58 [DS Table 3-49].
  # HFOV tolerance +/- 1 deg gives f in [416.7, 431.5] px.
  # Confirmed by [BKM] 3e: f = 0.5 * Xres / tan(HFOV/2) with HFOV = 90 deg, Xres = 848 for the D435.
  f_px: {value: 424.0, source: "derived from [DS] Table 3-13, formula and values in [BKM] 3e", verified: true}
  # Stated depth FOV HD 87 x 58 deg at 2 m [DS Table 3-49, R25 Table 1]. It is smaller than the imager
  # HFOV because of the left invalid band (overlap of both imagers, [DS Sec. 4.4-4.5]), not because of
  # non-square pixels. The DS formula gives 89.3 deg at 2 m; table value 87 is within the stated
  # ~ +/- 3 deg module tolerance [DS Table 3-49 note 3].
  depth_hfov_deg: {value: 87.0, source: "[DS] Table 3-49", verified: true}
  depth_vfov_deg: {value: 58.0, source: "[DS] Table 3-49", verified: true}

stereo:
  baseline_m: {value: 0.050, source: "[DS] Table 3-49 (D435 camera)", verified: true}
  # Left imager is the matching reference; left band of width B*f/Z pixels has no depth [DS Sec. 4.5].
  invalid_band: {side: left, source: "[DS] Sec. 4.5", verified: true}
  # Disparity RMS error ("subpixel"), constant in disparity space -> sigma_z = z^2 * subpixel / (f * B) [K17 Eq. 2, BKM 3e].
  # Intel: D435 with its projector normally 0.07-0.11 px [PRJ Sec. 3]; BKM uses 0.08 for D435 at 848x480 [BKM 3e].
  # Independent check: back-calculated from [R25] Table 3 (SD 0.75 % at 2 m): 0.015 * 424 * 0.05 / 4 = 0.080 px.
  # Single D435 on a white wall at 0.9 m measured 0.14 px [PRJ Fig. 13] -> use 0.07-0.14 as sensitivity range.
  subpixel_rms_px: {value: 0.080, range: [0.07, 0.14], source: "[BKM] 3e, [PRJ] Sec. 3, consistent with [R25] Table 3", verified: true}
  # Noise is spatially smooth ("bumps", "egg carton") and temporally consistent for a static scene,
  # not i.i.d. per pixel [K17 Sec. 4.2.6, 4.2.9; BKM 3e]. Correlation length not stated -> sensitivity parameter.
  noise_correlation_px: {value: 2.0, range: [0, 4], source: "assumption (sensitivity parameter)", verified: false}
  # Minimum disparity quantisation step of the D4 ASIC [PRJ Sec. 3].
  disparity_step_px: {value: 0.032, source: "[PRJ] Sec. 3", verified: true}
  # Default depth unit 1 mm (16 bit) [PRJ Sec. 3, BKM 8a]. At 0.7 m one disparity step is ~0.74 mm, so both matter.
  depth_unit_m: {value: 0.001, source: "[BKM] 8a, [PRJ] Sec. 3", verified: true}

range:
  # Hard limit: no depth closer than Min-Z at 848x480 [DS Table 4-11].
  # [BKM] 11c also says ~19.5 cm; its own formula f*B/126 gives 16.8 cm (BKM 5b). Use the datasheet value.
  min_z_m: {value: 0.195, source: "[DS] Table 4-11 (848x480)", verified: true}
  # No hard maximum in [DS]; error grows with z^2. "Ideal range" 0.3-3 m [R25 Table 1, manufacturer].
  ideal_min_z_m: {value: 0.3, source: "[R25] Table 1 (manufacturer)", verified: true}
  ideal_max_z_m: {value: 3.0, source: "[R25] Table 1 (manufacturer)", verified: true}

# Reference values for validating the noise model (not used as model inputs).
validation:
  # Factory spec, <= 2 m, 80 % ROI, HD resolution [DS Table 4-14].
  spec_z_accuracy_rel: {value: 0.02, source: "[DS] Table 4-14 (+/-)", verified: true}
  spec_rms_spatial_noise_rel: {value: 0.02, source: "[DS] Table 4-14 (<=)", verified: true}
  spec_temporal_noise_rel: {value: 0.01, source: "[DS] Table 4-14 (<=)", verified: true}
  spec_fill_rate: {value: 0.99, source: "[DS] Table 4-14 (>=)", verified: true}
  # Measured on a plane [R25].
  plane_sd_at_2m_rel: {value: 0.0075, source: "[R25] Table 3", verified: true}
  plane_bias_at_2m_rel: {value: 0.0187, source: "[R25] Table 3 (overestimation, Sec. IV-A)", verified: true}
  plane_sd_up_to_1m_cm: {value: "< 0.5", source: "[R25] Sec. IV-A (all cameras)", verified: true}

# Material and silhouette effects, measured on real D415 depth of metal parts.
# [ROBI] Yang et al., ROBI: A Multi-View Dataset for Reflective Objects in Robotic Bin-Picking, IROS 2021,
#        arXiv:2105.04112, CC BY-NC-SA 4.0. Measured with scripts/robi_d415_metal.py on object Zigzag
#        (bent steel sheet part), scene 4, 125 views, z = 0.31-0.42 m, 1280x720, objects with visibility >= 0.95,
#        CAD-rendered ground truth. Per-view median signed error 0.0-1.0 mm (p10-p90) -> alignment is consistent.
# Caveats: D415 not D435 (same D4 ASIC, baseline 55 vs 50 mm, other imagers); steel not anodised aluminium;
# bin not modelled. Mechanism (not used as numbers): two failure modes, saturation at head-on incidence
# [K17 Sec. 4.2.5, BKM 3a, 13b] and too little returned light at grazing incidence [K17 Sec. 4.2.8].
effects:
  metal:
    material_names: [alu]
    # Bin centres of the incidence-angle classes (interior pixels, 3 px silhouette band excluded).
    angle_deg: [5, 15, 25, 35, 45, 55, 65, 75, 85]
    dropout_rate: [0.160, 0.091, 0.113, 0.141, 0.134, 0.190, 0.314, 0.458, 0.602]
    # Median signed error real - GT (positive = depth overestimated).
    bias_mm: [-0.09, 0.28, 0.36, 0.52, 0.64, 1.07, 1.85, 2.17, 0.38]
    # Robust spread (1.4826 * MAD) in excess of the best-angle floor of 1.32 mm, sqrt(s^2 - 1.32^2).
    # The floor contains GT alignment error (~0.8 mm ICP residual reported by [ROBI]) and base stereo
    # noise, which is modelled separately by disparity_noise; not subtracting it would double count.
    sigma_mm: [0.18, 0.0, 0.67, 1.05, 1.29, 1.72, 2.63, 3.82, 5.97]
    source: "measured on [ROBI] Zigzag scene 4, results/robi/zigzag_s4_summary.json"
    # Dropouts and errors come in blobs, not single pixels; blob size not measured yet.
    corr_px: {value: 3.0, range: [0, 6], source: "assumption (sensitivity parameter)", verified: false}
  edges:
    # Band definition used for the measurement (instance change within 3 px).
    width_px: {value: 3, source: "measurement definition in scripts/robi_d415_metal.py", verified: true}
    p_drop: {value: 0.280, source: "[ROBI] Zigzag S4, invalid rate in silhouette band", verified: true}
    # Valid band pixels with |err| > 5 mm (11.2 %) as a fraction of all band pixels: 0.112 * (1 - 0.28).
    p_fly: {value: 0.081, source: "[ROBI] Zigzag S4, derived", verified: true}
